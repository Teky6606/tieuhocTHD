<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý Thời Khóa Biểu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      max-width: 800px;
      margin-top: 50px;
    }
    .table td input {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">Quản lý Thời Khóa Biểu</h2>
    <div class="mb-3">
      <label class="form-label">Chọn Khối Lớp:</label>
      <select id="gradeSelect" class="form-select">
        <option value="Khối 1">Khối 1</option>
        <option value="Khối 2">Khối 2</option>
        <option value="Khối 3">Khối 3</option>
        <option value="Khối 4">Khối 4</option>
        <option value="Khối 5">Khối 5</option>
      </select>
    </div>
    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Thứ</th>
          <th>Môn học (phân cách bằng dấu phẩy)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Thứ 2</td>
          <td><input id="t2" type="text" class="form-control"></td>
        </tr>
        <tr>
          <td>Thứ 3</td>
          <td><input id="t3" type="text" class="form-control"></td>
        </tr>
        <tr>
          <td>Thứ 4</td>
          <td><input id="t4" type="text" class="form-control"></td>
        </tr>
        <tr>
          <td>Thứ 5</td>
          <td><input id="t5" type="text" class="form-control"></td>
        </tr>
        <tr>
          <td>Thứ 6</td>
          <td><input id="t6" type="text" class="form-control"></td>
        </tr>
      </tbody>
    </table>
    <button class="btn btn-primary w-100" onclick="updateSchedule()">Lưu thời khóa biểu</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="exportPDF()">Xuất File PDF</button>
  </div>
  <!-- Toast thông báo -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">Thông báo</strong>
        <small>Vừa xong</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Đóng"></button>
      </div>
      <div class="toast-body" id="toastBody">
        <!-- Nội dung thông báo -->
      </div>
    </div>
  </div>
  <script src="asset/js/main.js"></script>
</body>
</html>
